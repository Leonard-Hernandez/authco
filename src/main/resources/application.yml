server:
  servlet:
    # Every endpoint lives under /authco, and the issuer follows it:
    # tokens carry iss=http://localhost:8087/authco.
    context-path: /authco
    session:
      tracking-modes:
      - cookie
  port: 8087

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/authco?createDatabaseIfNotExist=true
    username: ${USER_DB}
    password: ${PASSWORD_DB}
  jpa:
    hibernate:
      ddl-auto: none
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: 
              - email
              - profile
              - openid
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-name: Google
            authorization-grant-type: authorization_code

authco:
  issuer: http://localhost:8087/authco
  jwk:
    master-key: ${master-key}
  cors:
    allowed-origins: http://localhost:4200