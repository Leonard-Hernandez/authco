<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Sign in · authco')}"></head>
<style>
    .login {
        width: 400px;
        max-width: 100%;
        display: flex;
        flex-direction: column;
        gap: 32px;
    }

    .intro { display: flex; flex-direction: column; gap: 20px; }
    .client { display: flex; align-items: center; gap: 12px; }
    .client-label { font-size: 14px; color: var(--muted); line-height: 1.4; }
    .client-name { color: var(--ink); font-weight: 500; }

    .heading { display: flex; flex-direction: column; gap: 8px; }
    .heading h1 { margin: 0; font-size: 36px; font-weight: 600; letter-spacing: -0.03em; line-height: 1.1; }
    .heading p { margin: 0; font-size: 15px; color: var(--muted); line-height: 1.5; }

    .providers { display: flex; flex-direction: column; gap: 10px; }

    .provider {
        display: flex;
        align-items: center;
        gap: 14px;
        height: 52px;
        padding: 0 18px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 12px;
        font-size: 15px;
        font-weight: 500;
        color: var(--ink);
        text-decoration: none;
    }

    .provider:hover { border-color: var(--ink); color: var(--ink); }

    .provider-mark {
        width: 22px;
        height: 22px;
        border-radius: 6px;
        background: var(--chip);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 11px;
        color: var(--muted);
    }

    /* Brand logos sit on the button itself, without the neutral chip. */
    .provider-logo { background: transparent; }

    .empty { margin: 0; font-size: 14px; color: var(--muted); }

    @media (max-width: 640px) {
        .login { width: 100%; justify-content: center; }
        .heading h1 { font-size: 32px; }
        .provider { padding: 0 16px; }
    }
</style>
<body>

    <header class="topbar">
        <div th:replace="~{fragments/layout :: brand}"></div>
    </header>

    <main class="main">
        <div class="login">

            <div class="intro">
                <!-- Optional: only rendered when the controller knows which client sent the user here. -->
                <div class="client" th:if="${clientName}">
                    <div class="app-mark" th:text="${#strings.toUpperCase(#strings.substring(clientName, 0, 1))}">A</div>
                    <div class="client-label">To continue to<br><span class="client-name" th:text="${clientName}">[Client app]</span></div>
                </div>

                <div class="heading">
                    <h1>Sign in</h1>
                    <p>Choose a provider. No new password needed.</p>
                </div>
            </div>

            <!-- Spring redirects to /login?error when federated login fails (e.g. unverified_email). -->
            <p class="alert" role="alert" th:if="${param.error}">
                We couldn't sign you in. Make sure your email is verified with the provider and try again.
            </p>

            <!-- providers: one entry per ClientRegistration, each with registrationId and clientName. -->
            <nav class="providers" aria-label="Sign-in providers">
                <a class="provider" th:each="provider : ${providers}"
                    th:href="@{/oauth2/authorization/{id}(id=${provider.registrationId})}">
                    <th:block th:switch="${provider.registrationId}">
                        <span th:case="'google'" class="provider-mark provider-logo" aria-hidden="true">
                            <svg width="18" height="18" viewBox="0 0 48 48">
                                <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"></path>
                                <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"></path>
                                <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"></path>
                                <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"></path>
                            </svg>
                        </span>
                        <span th:case="*" class="provider-mark mono" aria-hidden="true"
                            th:text="${#strings.toUpperCase(#strings.substring(provider.clientName, 0, 1))}">G</span>
                    </th:block>
                    <span th:text="|Continue with ${provider.clientName}|">Continue with Google</span>
                </a>
                <p class="empty" th:if="${#lists.isEmpty(providers)}">No sign-in providers are configured.</p>
            </nav>

        </div>
    </main>

    <footer class="footer">
        <svg th:replace="~{fragments/layout :: shield}"></svg>
        Secured by authco
    </footer>

</body>
</html>
