<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">authco</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
    <!-- Inlined on purpose: the default filter chain requires authentication for every
         request, so a /css/** file would not load on the login page. -->
    <style>
        :root {
            --ink: #17171B;
            --ink-2: #3A3A42;
            --muted: #5E5E66;
            --line: #E2E0DA;
            --line-soft: #EDEBE6;
            --chip: #EDEBE6;
            --ground: #F4F3EF;
            --surface: #FFFFFF;
            --accent: #3346D3;
            --danger: #B42318;
            --danger-ground: #FDF1EF;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            font-family: 'Geist', system-ui, sans-serif;
            color: var(--ink);
            background: var(--ground);
            -webkit-font-smoothing: antialiased;
        }

        a {
            color: var(--ink);
            text-decoration: underline;
            text-decoration-color: #B9B7B0;
            text-underline-offset: 3px;
        }

        a:hover { color: var(--accent); text-decoration-color: var(--accent); }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 28px 40px;
        }

        .brand { display: flex; align-items: center; gap: 10px; }
        .brand-name { font-size: 17px; font-weight: 600; letter-spacing: -0.02em; }

        .main {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .footer {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 24px 40px;
            font-size: 13px;
            color: var(--muted);
        }

        .mono { font-family: 'Geist Mono', monospace; }

        .app-mark {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            background: var(--ink);
            color: #FFFFFF;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 16px;
            flex-shrink: 0;
        }

        .avatar {
            border-radius: 999px;
            background: var(--chip);
            color: var(--ink-2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            flex-shrink: 0;
        }

        .btn {
            height: 48px;
            border-radius: 12px;
            font: inherit;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            width: 100%;
        }

        .btn-primary { border: 0; background: var(--ink); color: #FFFFFF; }
        .btn-primary:hover { background: #2A2A30; }
        .btn-secondary { border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
        .btn-secondary:hover { border-color: #B9B7B0; }

        .btn:focus-visible,
        .provider:focus-visible,
        a:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        .alert {
            margin: 0;
            padding: 12px 14px;
            border-radius: 12px;
            background: var(--danger-ground);
            color: var(--danger);
            font-size: 14px;
            line-height: 1.5;
        }

        @media (max-width: 640px) {
            .topbar { padding: 44px 24px 0; }
            .brand-name { font-size: 16px; }
            .main { align-items: stretch; padding: 24px; }
            .footer { padding: 16px 24px 36px; font-size: 12px; }
        }
    </style>
</head>
<body>

    <div th:fragment="brand" class="brand">
        <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">
            <rect width="24" height="24" rx="7" fill="#3346D3"></rect>
            <circle cx="12" cy="10" r="3.2" fill="#FFFFFF"></circle>
            <rect x="10.6" y="12" width="2.8" height="6" rx="1.4" fill="#FFFFFF"></rect>
        </svg>
        <span class="brand-name">authco</span>
    </div>

    <svg th:fragment="shield" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="1.8" aria-hidden="true">
        <path d="M12 3l7 3v5c0 4.5-3 8.3-7 10-4-1.7-7-5.5-7-10V6l7-3z"></path>
    </svg>

</body>
</html>
